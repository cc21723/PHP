  <style>
    /* 全域設定 */
    body {
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f9f9fb;
      margin: 0;
      padding: 0;
      color: #333;
    }

    /* 頁面標題 */
    .header {
      background: linear-gradient(to right, #e0c3fc, #8ec5fc);
      color: #fff;
      text-align: center;
      padding: 1.5rem;
      margin-bottom: 2rem;
      font-size: 2rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      letter-spacing: 2px;
      border-radius: 0 0 20px 20px;
    }

    /* 班級導覽按鈕區塊 */
    .class-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      padding: 0 1rem;
    }

    /* 每個班級按鈕 */
    .class-nav button {
      background-color: #f8e8ff;
      border: none;
      border-radius: 12px;
      padding: 0.7rem 1.2rem;
      font-size: 1rem;
      color: #6c3483;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .class-nav button:hover {
      background-color: #e2ccfa;
      transform: scale(1.05);
    }

    /* 表格樣式 */
    .table {
      width: 90%;
      margin: 2rem auto;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      overflow: hidden;
    }

    .table th,
    .table td {
      padding: 1rem;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    .table th {
      background-color: #f0dfff;
      color: #5e3370;
      font-weight: bold;
    }


    /* 響應式設計 */
    @media (max-width: 600px) {
      .header {
        font-size: 1.5rem;
        padding: 1rem;
      }

      .class-nav {
        flex-direction: column;
        align-items: center;
      }

      .class-nav button {
        width: 80%;
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>
  <h1 class="header">學生資料管理系統</h1>
  <div class="class-nav"></div>

</body>
