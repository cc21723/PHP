<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>學生資料管理系統</title>
  <link rel="shortcut icon" href="#" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <!---匯入要使用的函式庫--->
  <!-------引入jQuery函式庫------->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js"
    integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    /* 全域設定 */
    body {
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: #f9f9fb;
      margin: 0;
      padding: 0;
      color: #333;
    }

    /* 頁面標題 */
    .header {
      background: linear-gradient(to right, #e0c3fc, #8ec5fc);
      color: #fff;
      text-align: center;
      padding: 1.5rem;
      margin-bottom: 2rem;
      font-size: 2rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      letter-spacing: 2px;
      border-radius: 0 0 20px 20px;
    }

    /* 班級導覽按鈕區塊 */
    .class-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      padding: 0 1rem;
    }

    /* 每個班級按鈕 */
    .class-nav button {
      background-color: #f8e8ff;
      border: none;
      border-radius: 12px;
      padding: 0.7rem 1.2rem;
      font-size: 1rem;
      color: #6c3483;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .class-nav button:hover {
      background-color: #e2ccfa;
      transform: scale(1.05);
    }

    /* 表格樣式 */
    table {
      width: 90%;
      margin: 2rem auto;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      overflow: hidden;
    }

    table th,
    table td {
      padding: 1rem;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    table th {
      background-color: #f0dfff;
      color: #5e3370;
      font-weight: bold;
    }

    /* 操作按鈕通用樣式 */
    .edit-btn,
    .delete-btn {
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 0 0.2rem;
    }

    /* 編輯按鈕樣式 */
    .edit-btn {
      background-color: #d1e7ff;
      color: #084298;
    }

    .edit-btn:hover {
      background-color: #a6ceff;
    }

    /* 刪除按鈕樣式 */
    .delete-btn {
      background-color: #ffe5e5;
      color: #c0392b;
    }

    .delete-btn:hover {
      background-color: #ffcccc;
    }

    /* 新增學生按鈕區塊置中 */
    .add {
      text-align: center;
      margin-top: 1rem;
    }

    /* 新增學生按鈕樣式 */
    .add-student {
      background-color: #d6f5e3;
      color: #256d4f;
      border: none;
      border-radius: 12px;
      padding: 0.6rem 1.5rem;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .add-student:hover {
      background-color: #b9ebcf;
      transform: scale(1.05);
    }

    /* 響應式設計 */
    @media (max-width: 600px) {
      .header {
        font-size: 1.5rem;
        padding: 1rem;
      }

      .class-nav {
        flex-direction: column;
        align-items: center;
      }

      .class-nav button {
        width: 80%;
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>
  <h1 class="header">學生資料管理系統</h1>
  <div class="class-nav"></div>
  <div class="add">
    <button class="add-student" onclick="location.href='add_student.html'">新增學生</button>
  </div>
  <div class="students">
    <table>
      <thead>
        <tr>
          <th>學號</th>
          <th>班級</th>
          <th>座號</th>
          <th>姓名</th>
          <th>生日</th>
          <th>地址</th>
          <th>電話</th>
          <th>操作</th>
        </tr>
      </thead>

      <tbody>

      </tbody>
    </table>
  </div>
</body>

</html>
<script>
  /************************************
  * 1.考慮觸發行為的事件
  * 2.建立監聽行為

  //取得所有班級資料
  getClassrooms();

  function getClassrooms() {
    $.get("./api/classrooms.php", function (classrooms) {
      console.log(classrooms);
      $('.class-nav').html('');
      classrooms.forEach(item => {
        $(".class-nav").append(`<button data-classroom='${item.classroom}'>${item.name}</button>`)
      });

      $('.class-nav button').on('click', function () {
        let classroom = $(this).data('classroom');
        getClassStudents(classroom);
      });
    })
  }

  getClassStudents('101'); // 預設載入101班級的學生資料
  //取得班級資料的函式
  function getClassStudents(classroom) {
    $(".students tbody").html(''); // 清空現有的學生資料
    $.get("./api/get_students.php", { classroom }, function (data) {
      console.log(data);

      //處理取得的班級資料，例如顯示在畫面上
      data.forEach(student => {
        $(".students tbody").append(`
        <tr>
          <td>${student.uni_id}</td>
          <td>${student.classname}</td>
          <td>${student.seat_num}</td>
          <td>${student.name}</td>
          <td>${student.birthday}</td>
          <td>${student.address}</td>
          <td>${student.telphone}</td>
          <td>
            <button class='edit-btn' data-id='${student.id}'>編輯</button>
            <button class='delete-btn' data-id='${student.id}'>刪除</button>
          </td>
        </tr>
        `);
      })
    })
  }

</script>
